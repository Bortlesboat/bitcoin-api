name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit

      - name: Run tests with coverage
        run: pytest tests/ -v --ignore=tests/test_e2e.py --ignore=tests/locustfile.py --cov=bitcoin_api --cov-report=term-missing --cov-fail-under=70

      - name: Docker build (smoke test)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: docker build -t bitcoin-api-test .

  gate:
    name: test
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = "success"
